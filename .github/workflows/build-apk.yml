name: Build APK

# Roda a cada push e também manualmente (aba Actions → Build APK → Run workflow).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # necessário para publicar o APK em "Releases"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Testes da lógica (motor de registros, descoberta, estatísticas)
        run: npm test

      - name: Build web (typecheck + vite)
        run: npm run build

      - name: Sincronizar projeto Android
        run: npx cap sync android

      # Assinatura: a chave fica só nos Secrets do GitHub (ANDROID_KEYSTORE_BASE64 e
      # ANDROID_KEYSTORE_PASSWORD), nunca no repositório. Sem eles, o APK sai com uma chave
      # temporária, serve só para conferir o build e não é publicado.
      - name: Preparar assinatura
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/app.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_ALIAS=riizzi"
              echo "ASSINATURA=oficial"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/temp.keystore" -storetype PKCS12 -alias temp \
              -keyalg RSA -keysize 2048 -validity 2 -storepass temporaria -keypass temporaria -dname "CN=Build de teste"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/temp.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=temporaria"
              echo "ANDROID_KEY_ALIAS=temp"
              echo "ASSINATURA=temporaria"
            } >> "$GITHUB_ENV"
            echo "::warning::Sem os segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD: APK assinado com chave temporária e não publicado em Releases."
          fi

      - name: Compilar APK assinado
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: Nomear o APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RoutineTracker.apk

      - name: Publicar em Releases
        if: github.event_name != 'pull_request' && env.ASSINATURA == 'oficial'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RoutineTracker build ${{ github.run_number }}
          body: Baixe **RoutineTracker.apk** abaixo e instale no celular.
          files: RoutineTracker.apk
          make_latest: true
